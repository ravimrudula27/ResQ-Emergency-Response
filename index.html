<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ResQ - Emergency Response</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🚨 ResQ</h1>
        <p class="subtitle">Emergency Response System</p>

        <button id="sosButton">🚨 SOS EMERGENCY</button>

        <p id="status"></p>

        <div class="info-box">
            <h2>📍 Your Location</h2>
            <p id="location">Location not detected</p>
        </div>

        <div class="info-box">
            <h2>🏥 Nearby Emergency Facilities</h2>

            <button onclick="findHospitals()">Find Nearby Hospitals</button>
            <button onclick="findPolice()">Find Police Stations</button>
        </div>

        <div class="info-box">
            <h2>📞 Emergency Contacts</h2>

            <p>🚑 Ambulance: <b>108</b></p>
            <p>👮 Police: <b>112</b></p>
            <p>🚒 Fire: <b>101</b></p>
        </div>

    </div>

    <script src="script.js"></script>
<button onclick="findAmbulance()">
    🚑 Find Nearby Ambulances
</button>
<button
 onclick="sendEmergencyWhatsApp()">
    📲 Send Emergency Alert
</button>
<script src="script.js"></script>
<h2>Nearby Emergency Services</h2>

<button onclick="findHospitals()">
    🏥 Find Nearby Hospitals
</button>

<button onclick="findPolice()">
    🚔 Find Nearby Police Stations
</button>

<button onclick="findAmbulance()">
    🚑 Find Nearby Ambulances
</button>
</body>
</html>
